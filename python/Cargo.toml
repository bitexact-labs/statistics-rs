[package]
name = "statistics-rs-python"
version = "0.1.0"
edition = "2021"
license = "PSF-2.0"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
statistics-rs = { path = ".." }
num-bigint = "0.4"
pyo3 = { version = "0.30", features = ["extension-module", "num-bigint"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
